jobs:
  test-job:
    runs-on: ubuntu-latest
    # Remove the permissions block to inherit repo settings
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Attempt Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git commit --allow-empty -m "Test commit" || echo "Commit failed (expected)"
          git push origin main || echo "Push failed (expected)"
